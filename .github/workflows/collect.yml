name: Collecte Super PDP

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 08:00 Europe/Paris
  workflow_dispatch:

permissions:
  contents: write   # pour re-committer state/last_id.txt

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecte des factures
        env:
          SUPERPDP_CLIENT_ID: ${{ secrets.SUPERPDP_CLIENT_ID }}
          SUPERPDP_CLIENT_SECRET: ${{ secrets.SUPERPDP_CLIENT_SECRET }}
          SP_TENANT: ${{ secrets.SP_TENANT }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          SP_DRIVE_ID: ${{ secrets.SP_DRIVE_ID }}
          SP_ROOT_FOLDER_ID: ${{ secrets.SP_ROOT_FOLDER_ID }}
        run: python run_collect.py

      - name: Mise à jour du pointeur d'id
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/last_id.txt
          git diff --cached --quiet || git commit -m "MAJ pointeur dernier id facture"
          git push
